# ~/.config/mise/conf.d/opencode-sandbox.toml

[hooks]
enter = '''
# This file is loaded globally, so MISE_PROJECT_ROOT points at the global
# config root rather than the repository being entered. Derive the sandbox
# project from the hook's transition path instead.
find_sandbox_project() {
  local dir="$1"

  while [ "$dir" != "/" ]; do
    for f in "$dir/.mise.toml" "$dir/mise.toml" "$dir/.mise/config.toml"; do
      if [ -f "$f" ] && grep -qi 'ENABLE_OPENCODE_SANDBOX.*true' "$f" 2>/dev/null; then
        printf '%s\n' "$dir"
        return 0
      fi
    done
    dir="$(dirname "$dir")"
  done
}

PROJECT_ROOT="$(find_sandbox_project "${MISE_ORIGINAL_CWD:-$PWD}")"

# MISE_ORIGINAL_CWD is the directory being entered. On a fresh shell mise can
# evaluate this hook before the first explicit cd, so do not start a VM for
# the global config root ($HOME).
if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "$HOME" ]; then
  exit 0
fi

session_key() {
  local session_tty
  local pid="${PPID:-$$}"
  local parent

  # Hooks run as short-lived subprocesses. Walk back to the terminal process
  # and use its TTY as the tab identity so enter and leave share one lease.
  for _ in 1 2 3 4 5 6 7 8; do
    session_tty="$(ps -o tty= -p "$pid" 2>/dev/null | tr -d ' ')"
    case "$session_tty" in
      tty*|ttys*) printf 'tty-%s\n' "$(printf '%s' "$session_tty" | md5 -q)"; return 0 ;;
    esac
    parent="$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')"
    [ -n "$parent" ] || break
    pid="$parent"
  done

  # Non-interactive callers have no TTY. The PID fallback is only for
  # automation; real terminal tabs use the branch above.
  session_tty=""
  case "$session_tty" in
    /dev/*) printf 'tty-%s\n' "$(printf '%s' "$session_tty" | md5 -q)" ;;
    *) printf 'pid-%s\n' "${PPID:-$$}" ;;
  esac
}

PROJECT_NAME="$(basename "$PROJECT_ROOT")"
VM_NAME="vm-${PROJECT_NAME}"
VM_CPUS="${OPENCODE_VM_CPUS:-2}"
VM_MEMORY="${OPENCODE_VM_MEMORY:-4}"

SESSION_DIR="${HOME}/.cache/opencode-sandbox-${VM_NAME}.sessions"
mkdir -p "$SESSION_DIR"
SESSION_KEY="$(session_key)"
# Register before any Lima work. Another tab may leave while this tab is still
# booting; without this early lease it could stop the shared VM.
for session_file in "$SESSION_DIR"/*; do
  [ -f "$session_file" ] || continue
  session_pid="$(basename "$session_file")"
  case "$session_pid" in
    pid-*)
      session_pid="${session_pid#pid-}"
      kill -0 "$session_pid" 2>/dev/null || rm -f "$session_file"
      ;;
    tty-*) ;;
    *) rm -f "$session_file" ;;
  esac
done
# Only clean leases abandoned for a full day; the leave hook removes normal
# leases. TTY leases are not checked by PID because the hook is a subprocess.
find "$SESSION_DIR" -type f -mmin +1440 -delete 2>/dev/null || true
SESSION_READY=false
printf '%s\n' "$$" > "$SESSION_DIR/$SESSION_KEY"
trap 'if [ "$SESSION_READY" != true ]; then rm -f "$SESSION_DIR/$SESSION_KEY"; fi; rm -rf "$LOCK_DIR"' EXIT

LOCK_DIR="${HOME}/.cache/opencode-sandbox-${VM_NAME}.lock"
mkdir -p "${HOME}/.cache"
waited=0
# mkdir is atomic on macOS, making this directory a cross-process mutex. The
# timeout prevents a crashed tab from making every later tab hang forever.
while ! mkdir "$LOCK_DIR" 2>/dev/null; do
  lock_pid=""
  [ -f "$LOCK_DIR/pid" ] && lock_pid="$(cat "$LOCK_DIR/pid" 2>/dev/null || true)"
  if [ -z "$lock_pid" ] || ! kill -0 "$lock_pid" 2>/dev/null; then
    rm -rf "$LOCK_DIR"
  elif [ "$waited" -ge 60 ]; then
    echo "⚠️ [mise] Sandbox VM is busy in another shell; leaving it unchanged."
    exit 0
  else
    sleep 1
    waited=$((waited + 1))
  fi
done
printf '%s\n' "$$" > "$LOCK_DIR/pid"

OPENCODE_PORT=$(python3 -c "import hashlib; print(10000 + int(hashlib.md5(b'${PROJECT_ROOT}').hexdigest(), 16) % 50000)")
export OPENCODE_SERVER_URL="http://localhost:${OPENCODE_PORT}"

echo "🤖 [mise] Initializing sandbox VM '${VM_NAME}' (${VM_CPUS} CPUs, ${VM_MEMORY}GiB RAM)..."

if ! command -v limactl >/dev/null 2>&1; then
  echo "❌ Error: 'limactl' is required. Install with: brew install lima"
  exit 1
fi

# Multiple terminal tabs share this VM, so do not restart an already-running
# instance from an enter hook.
if ! limactl list -q | grep -q "^${VM_NAME}$"; then
  LIMA_TEMPLATE=$(mktemp)
  cat << 'EOF' > "$LIMA_TEMPLATE"
mountType: "virtiofs"
mounts: []
images:
  - location: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: "aarch64"
EOF

  limactl start --tty=false \
    --name="${VM_NAME}" \
    --cpus="${VM_CPUS}" \
    --memory="${VM_MEMORY}" \
    --mount-only "${PROJECT_ROOT}:w" \
    --set ".portForwards[0].guestPort = 4242" \
    --set ".portForwards[0].hostPort = ${OPENCODE_PORT}" \
    "$LIMA_TEMPLATE"

  rm -f "$LIMA_TEMPLATE"
elif ! limactl list "${VM_NAME}" | grep -q "^${VM_NAME}[[:space:]]*Running"; then
  limactl start "${VM_NAME}" >/dev/null 2>&1
fi

# Mask the mounted host config inside the guest so guest-side tools cannot
# recursively execute the host sandbox hook.
limactl shell "${VM_NAME}" -- bash -c "
  for f in '${PROJECT_ROOT}/.mise.toml' '${PROJECT_ROOT}/mise.toml' '${PROJECT_ROOT}/.mise/config.toml'; do
    if [ -f \"\$f\" ]; then
      sudo mount --bind /dev/null \"\$f\" 2>/dev/null || true
    fi
  done
"

# Bound the installer: network failures must return control to the shell
# instead of making a directory change appear hung.
limactl shell "${VM_NAME}" -- bash -c "export PATH=\$HOME/.opencode/bin:\$PATH; command -v opencode >/dev/null 2>&1 || curl --connect-timeout 10 --max-time 300 -fsSL https://opencode.ai/install | bash"

# Sync host OpenCode config if present
if [ -f "$HOME/.config/opencode/opencode.json" ]; then
  limactl shell "${VM_NAME}" -- bash -c "mkdir -p \$HOME/.config/opencode"
  cat "$HOME/.config/opencode/opencode.json" | limactl shell "${VM_NAME}" -- bash -c "cat > \$HOME/.config/opencode/opencode.json"
fi

# Start the server only once. --no-block is critical because opencode serve is
# long-running; waiting for systemd-run would block the enter hook. Lima guests
# may lack a user systemd bus, hence the detached-process fallback.
limactl shell "${VM_NAME}" -- bash -c "
    if systemctl --user is-active --quiet opencode-server; then
      exit 0
    elif systemctl --user is-system-running >/dev/null 2>&1; then
      systemd-run --user --no-block --unit=opencode-server \
        --setenv=PATH=\$HOME/.opencode/bin:/usr/local/bin:/usr/bin:/bin \
        --setenv=REQUESTY_API_KEY='${REQUESTY_API_KEY:-}' \
        --working-directory='${PROJECT_ROOT}' \
        \$HOME/.opencode/bin/opencode serve --port 4242 --hostname 0.0.0.0
    else
      cd '${PROJECT_ROOT}'
      nohup env PATH=\$HOME/.opencode/bin:/usr/local/bin:/usr/bin:/bin \
        REQUESTY_API_KEY='${REQUESTY_API_KEY:-}' \
        \$HOME/.opencode/bin/opencode serve --port 4242 --hostname 0.0.0.0 \
        >/tmp/opencode-server.log 2>&1 </dev/null &
    fi
  "

for i in $(seq 1 10); do
  # Readiness is best-effort, but the loop must remain bounded if the guest is
  # still starting or the server is unavailable.
  if curl --connect-timeout 1 --max-time 2 -s "${OPENCODE_SERVER_URL}/" >/dev/null 2>&1; then
    break
  fi
  sleep 0.5
done

echo "✅ Sandboxed environment active!"
echo "👉 Connect with: mise run opencode"
SESSION_READY=true
'''

leave = '''
# This helper is repeated because mise runs enter and leave as independent
# inline shells; functions from the enter hook are not available here.
find_sandbox_project() {
  local dir="$1"

  while [ "$dir" != "/" ]; do
    for f in "$dir/.mise.toml" "$dir/mise.toml" "$dir/.mise/config.toml"; do
      if [ -f "$f" ] && grep -qi 'ENABLE_OPENCODE_SANDBOX.*true' "$f" 2>/dev/null; then
        printf '%s\n' "$dir"
        return 0
      fi
    done
    dir="$(dirname "$dir")"
  done
}

# A new shell may have no previous directory. There is nothing to stop in that
# case; without this guard opening a new tab begins with a misleading leave.
if [ -z "${MISE_PREVIOUS_DIR:-}" ]; then
  exit 0
fi

PROJECT_ROOT="$(find_sandbox_project "$MISE_PREVIOUS_DIR")"

if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "$HOME" ]; then
  exit 0
fi

CURRENT_ROOT="$(find_sandbox_project "${MISE_ORIGINAL_CWD:-$PWD}")"
# Moving within the same project is not leaving the sandbox.
if [ "$CURRENT_ROOT" = "$PROJECT_ROOT" ]; then
  exit 0
fi

PROJECT_NAME="$(basename "$PROJECT_ROOT")"
VM_NAME="vm-${PROJECT_NAME}"

session_key() {
  local session_tty
  local pid="${PPID:-$$}"
  local parent

  # Match enter's tab identity. Do not use the hook PID or mise's encoded
  # environment/session value: both can change between directory transitions.
  for _ in 1 2 3 4 5 6 7 8; do
    session_tty="$(ps -o tty= -p "$pid" 2>/dev/null | tr -d ' ')"
    case "$session_tty" in
      tty*|ttys*) printf 'tty-%s\n' "$(printf '%s' "$session_tty" | md5 -q)"; return 0 ;;
    esac
    parent="$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')"
    [ -n "$parent" ] || break
    pid="$parent"
  done

  session_tty=""
  case "$session_tty" in
    /dev/*) printf 'tty-%s\n' "$(printf '%s' "$session_tty" | md5 -q)" ;;
    *) printf 'pid-%s\n' "${PPID:-$$}" ;;
  esac
}

LOCK_DIR="${HOME}/.cache/opencode-sandbox-${VM_NAME}.lock"
mkdir -p "${HOME}/.cache"
waited=0
while ! mkdir "$LOCK_DIR" 2>/dev/null; do
  lock_pid=""
  [ -f "$LOCK_DIR/pid" ] && lock_pid="$(cat "$LOCK_DIR/pid" 2>/dev/null || true)"
  if [ -z "$lock_pid" ] || ! kill -0 "$lock_pid" 2>/dev/null; then
    rm -rf "$LOCK_DIR"
  elif [ "$waited" -ge 60 ]; then
    echo "⚠️ [mise] Sandbox VM is busy in another shell; leaving it running."
    exit 0
  else
    sleep 1
    waited=$((waited + 1))
  fi
done
printf '%s\n' "$$" > "$LOCK_DIR/pid"
trap 'rm -rf "$LOCK_DIR"' EXIT

SESSION_DIR="${HOME}/.cache/opencode-sandbox-${VM_NAME}.sessions"
mkdir -p "$SESSION_DIR"
SESSION_KEY="$(session_key)"
printf '%s\n' "$$" > "$SESSION_DIR/$SESSION_KEY"
trap 'rm -f "$SESSION_DIR/$SESSION_KEY"; rm -rf "$LOCK_DIR"' EXIT

echo "🛑 [mise] Stopping OpenCode server & VM (${VM_NAME})..."

rm -f "$SESSION_DIR/$SESSION_KEY"
# Keep the VM alive while another terminal tab owns a lease. Stopping here
# would interrupt that tab's active OpenCode session.
if [ -n "$(find "$SESSION_DIR" -type f -print -quit 2>/dev/null)" ]; then
  echo "ℹ️ [mise] Keeping ${VM_NAME} running for another shell."
  exit 0
fi

limactl shell "${VM_NAME}" -- systemctl --user stop opencode-server 2>/dev/null || true
limactl stop "${VM_NAME}" 2>/dev/null || true
'''
